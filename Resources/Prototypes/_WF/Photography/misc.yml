- type: entity
  id: ActionPhotoAiCapture
  name: Take photo
  description: Take a photo of a spot the station cameras can see.
  components:
  - type: WorldTargetAction
    icon:
      sprite: _WF/Photography/camera.rsi
      state: icon
    itemIconStyle: NoItem
    priority: -8
    useDelay: 2
    checkCanAccess: false
    range: 0
    event: !type:PhotoAiCaptureActionEvent

- type: entity
  id: ActionPhotoGallery
  name: View photos
  description: Look through the photos you have taken.
  components:
  - type: InstantAction
    icon:
      sprite: _WF/Photography/album.rsi
      state: album
    itemIconStyle: NoItem
    priority: -8
    event: !type:PhotoGalleryActionEvent

- type: trait
  id: Photographer
  name: trait-photographer-name
  description: trait-photographer-desc
  category: Quirks
  components:
  - type: Photographer

- type: latheRecipePack
  id: PhotographyStatic
  recipes:
  - Camera
  - CameraFilm

- type: latheRecipe
  id: Camera
  result: Camera
  categories:
  - Tools
  completetime: 4
  materials:
    Steel: 100
    Glass: 200

- type: latheRecipe
  id: CameraFilm
  result: CameraFilm
  categories:
  - Tools
  completetime: 1
  materials:
    Steel: 20
    Glass: 20

- type: latheRecipe
  parent: BaseBorgModuleRecipe
  id: BorgModulePhotography
  result: BorgModulePhotography

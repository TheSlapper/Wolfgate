- type: entity
  parent: BaseStructure
  id: CitadelRPDerelictJarShelf
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Decoration/derelict_props_citadelrp.rsi
    state: jarshelf
    noRot: true
  - type: InteractionOutline

- type: entity
  parent: BaseStructure
  id: CitadelRPDerelictPod
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Decoration/derelict_props_citadelrp.rsi
    layers:
    - state: active_pod
      map: [ "base" ]
  - type: RandomSprite
    available:
    - base:
        active_pod: ""
    - base:
        active_pod2: ""
    - base:
        active_pod3: ""
  - type: InteractionOutline
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Glass
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          CitadelRPDerelictPodBroken:
            min: 1
            max: 1
        offset: 0
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: PointLight
    radius: 1.5
    energy: 0.6
    color: "#9a7cff"

